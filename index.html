<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.webmanifest">
  <title>老树提词器</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#090909;color:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.setup{min-height:100dvh;max-width:540px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-size:15px;font-weight:700;letter-spacing:.16em}.sub{color:#999;font-size:11px;letter-spacing:.12em}.editor{display:flex;min-height:0;flex:1;flex-direction:column}.label{color:#999;font-size:11px;letter-spacing:.13em;margin:0 0 12px}textarea{display:block;flex:1;min-height:260px;width:100%;resize:none;border:1px solid #292929;border-radius:16px;background:transparent;padding:18px;color:#f5f5f2;font:16px/1.8 inherit;outline:0}textarea:focus{border-color:#737373}textarea::placeholder{color:#656565}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.count{color:#999;font-size:12px}.start{border:0;border-radius:99px;padding:13px 19px;background:#f5f5f2;color:#090909;font-size:14px;font-weight:750}.stage{display:none;position:fixed;inset:0;overflow:hidden;background:#090909}.stage.active{display:block}.stage:after{content:"";position:absolute;z-index:4;inset:0;background:linear-gradient(#090909 0%,transparent 18%,transparent 81%,#090909 100%);pointer-events:none}.exit{position:absolute;z-index:10;top:calc(14px + env(safe-area-inset-top));left:16px;width:39px;height:39px;border:1px solid #444;border-radius:50%;background:#151515;color:#fff;font-size:22px}.window{position:absolute;z-index:3;width:min(72vw,340px);height:min(29vh,240px);min-height:142px;top:34vh;left:14vw;overflow:hidden;border:1px solid rgba(255,255,255,.56);border-radius:15px;background:rgba(13,13,13,.92);box-shadow:0 16px 46px #000;touch-action:none}.drag{height:34px;display:flex;align-items:center;justify-content:center}.grip{width:28px;height:3px;border-radius:9px;background:#777}.screen{height:calc(100% - 34px);overflow:hidden;padding:0 18px}.words{white-space:pre-wrap;color:#fff;font-size:clamp(17px,5vw,23px);font-weight:520;letter-spacing:.02em;line-height:1.7;animation:scroll var(--duration,75s) linear infinite paused}.words.go{animation-play-state:running}@keyframes scroll{from{transform:translateY(100%)}to{transform:translateY(-100%)}}.tip{position:absolute;z-index:6;bottom:calc(19px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#888;font-size:11px;letter-spacing:.12em;white-space:nowrap;transition:.3s}.controls{position:absolute;z-index:7;bottom:calc(44px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border:1px solid #323232;border-radius:99px;background:rgba(22,22,22,.94)}.controls button{height:36px;min-width:36px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:16px}.controls .run{padding:0 12px;background:#f5f5f2;color:#090909;font-size:13px;font-weight:750}.rate{width:34px;color:#bbb;font-size:11px;text-align:center}@media(min-width:600px){body{background:#242424}.setup{background:#090909;box-shadow:0 0 55px #000}.stage{max-width:540px;margin:auto}}
  </style>
</head>
<body>
  <main class="setup"><header><div class="brand">老树提词器</div><div class="sub">TELEPROMPTER</div></header><section class="editor"><p class="label">粘贴你的口播脚本</p><textarea id="draft" aria-label="口播脚本" placeholder="把口播脚本粘贴在这里……"></textarea><div class="bottom"><span class="count" id="count"></span><button class="start" id="open">开始提词</button></div></section></main>
  <section class="stage" id="stage"><button class="exit" id="close" aria-label="退出">×</button><div class="window" id="window"><div class="drag" id="drag"><i class="grip"></i></div><div class="screen"><div class="words" id="words"></div></div></div><div class="controls"><button id="minus" aria-label="减慢">−</button><span class="rate" id="rate">1.0×</span><button id="plus" aria-label="加快">＋</button><button class="run" id="run">播放</button></div><div class="tip" id="tip">拖动顶部横线调整位置</div></section>
  <script>
    const $=id=>document.getElementById(id), draft=$('draft'), count=$('count'), stage=$('stage'), words=$('words'), run=$('run'), rateLabel=$('rate'), box=$('window'), tip=$('tip');
    let rate=1,playing=false,dragging; draft.value=localStorage.getItem('laoshu-script')||'';
    function countText(){count.textContent=`${draft.value.replace(/\s/g,'').length} 字`;localStorage.setItem('laoshu-script',draft.value)}countText();draft.addEventListener('input',countText);
    function speed(){words.style.setProperty('--duration',`${Math.max(20,75/rate)}s`);rateLabel.textContent=`${rate.toFixed(1)}×`;localStorage.setItem('laoshu-rate',rate)}rate=+(localStorage.getItem('laoshu-rate')||1);speed();
    $('open').onclick=()=>{words.textContent=draft.value.trim()||'请先输入你的口播脚本。';stage.classList.add('active')};$('close').onclick=()=>{stage.classList.remove('active');playing=false;words.classList.remove('go');run.textContent='播放'};
    run.onclick=()=>{playing=!playing;words.classList.toggle('go',playing);run.textContent=playing?'暂停':'播放'};$('minus').onclick=()=>{rate=Math.max(.5,rate-.1);speed()};$('plus').onclick=()=>{rate=Math.min(2.5,rate+.1);speed()};
    const handle=$('drag');handle.addEventListener('pointerdown',e=>{const r=box.getBoundingClientRect();dragging={x:e.clientX,y:e.clientY,l:r.left,t:r.top};handle.setPointerCapture(e.pointerId);tip.style.opacity=0});handle.addEventListener('pointermove',e=>{if(!dragging)return;box.style.left=`${Math.max(0,Math.min(innerWidth-box.offsetWidth,dragging.l+e.clientX-dragging.x))}px`;box.style.top=`${Math.max(0,Math.min(innerHeight-box.offsetHeight,dragging.t+e.clientY-dragging.y))}px`});handle.addEventListener('pointerup',()=>dragging=null);
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
